services:
  claude-code:
    build: .
    stdin_open: true
    tty: true
    # agent.env: secrets the agent is trusted to use with full agency
    # (e.g. AGENT_GITHUB_TOKEN). Never put a guarded secret here --
    # see gateway.env / mcp-gateway below instead. (gitignored)
    env_file: agent.env
    environment:
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - http_proxy=http://proxy:3128
      - https_proxy=http://proxy:3128
      # mcp-gateway must NOT go through squid -- it's local traffic
      - NO_PROXY=localhost,127.0.0.1,mcp-gateway
      - no_proxy=localhost,127.0.0.1,mcp-gateway
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - sandbox # internal-only: no direct internet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4
    pids_limit: 512

  proxy:
    image: ubuntu/squid:latest
    user: proxy
    entrypoint: ["squid", "-N", "-d", "1", "-f", "/etc/squid/squid.conf"]
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - sandbox
      - egress
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  mcp-gateway:
    build: ./gateway
    # gateway.env: guarded secrets the agent must never see directly
    # (e.g. EXAMPLE_API_KEY). Exposed to the agent only via the narrow
    # tools defined in gateway/server.js. (gitignored)
    env_file: gateway.env
    restart: unless-stopped
    networks:
      - sandbox # reachable by the agent (tools only)
      - egress # direct API access; trusted code, no allowlist
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    # NOTE: no ports published to the host on purpose

networks:
  sandbox:
    internal: true # containers here cannot reach the internet, EXCEPT the mcp-gateway
  egress:
