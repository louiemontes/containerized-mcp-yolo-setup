# Egress allowlist for the YOLO sandbox.
# Deny-by-default: if a domain isn't listed here, Claude can't reach it.
http_port 3128

# --- allowlist ---
acl allowed dstdomain .anthropic.com          # Claude API
acl allowed dstdomain registry.npmjs.org      # npx/npm installs
# acl allowed dstdomain github.com codeload.github.com raw.githubusercontent.com
# ^ uncomment only if you re-add git/GitHub workflows, and understand
#   that this re-opens an exfil + injection channel.

# --- rules ---
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# keep logs useful for auditing what the agent tried to reach
access_log stdio:/dev/stdout squid
cache deny all
