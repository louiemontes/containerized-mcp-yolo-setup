pid_filename none

# Egress allowlist for the YOLO sandbox.
# Deny-by-default: if a domain isn't listed here, Claude can't reach it.
http_port 3128

# --- allowlist ---
acl allowed dstdomain .anthropic.com          # Claude API
acl allowed dstdomain registry.npmjs.org      # npx/npm installs
# GitHub access for the agent -- gated by a fine-grained PAT
# (AGENT_GITHUB_TOKEN) scoped to specific repos/permissions, so a
# compromised agent can still only exfil to/act on what the PAT allows.
acl allowed dstdomain github.com api.github.com codeload.github.com raw.githubusercontent.com

acl allowed dstdomain cdn.playwright.dev
acl allowed dstdomain playwright.download.prss.microsoft.com


# --- rules ---
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed dstdomain mcp-gateway
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# keep logs useful for auditing what the agent tried to reach
access_log stdio:/dev/stdout squid
cache deny all
